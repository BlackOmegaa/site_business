<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <div class="register-container">

        <div class="logo-container">
            <a class="logo" routerLink="/home">Society</a>
        </div>

        <div class="register-box">
            <h2 class="register-title">Créer un compte</h2>

            <form>
                <div class="form-group">
                    <label for="name">Nom</label>
                    <input type="text" id="name" placeholder="Jean Dupont" required />
                </div>
                <div class="form-group">
                    <label for="prenom">Prénom</label>
                    <input type="text" id="name" placeholder="Jean Dupont" required />
                </div>

                <div class="form-group">
                    <label for="email">Adresse email</label>
                    <input type="email" id="email" placeholder="exemple@email.com" required />
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" placeholder="••••••••" required />
                </div>

                <button type="submit" class="register-btn">Créer mon compte</button>
            </form>

            <p class="register-footer">
                Vous avez déjà un compte ?
                <a routerLink="/login">Se connecter</a>
            </p>
        </div>
    </div>
</body>

</html>
