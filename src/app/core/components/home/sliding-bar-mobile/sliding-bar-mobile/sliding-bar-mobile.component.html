<div class="mobile-slider-container">
    <h2 class="slider-title">Pourquoi nous choisir ?</h2>

    <div class="slider-wrapper" id="sliderWrapper">
        <div class="slider" [style.transform]="'translateX(-' + currentIndex * 100 + '%)'">
            <div class="slider-item" *ngFor="let item of items">
                <img [src]="item.icon" class="icon" />
                <h3>{{ item.title }}</h3>
                <p>{{ item.text }}</p>
            </div>
        </div>
    </div>

    <div class="arrow-buttons">
        <button class="arrow" (click)="scrollLeft()" [disabled]="currentIndex === 0">‹</button>
        <button class="arrow" (click)="scrollRight()" [disabled]="currentIndex === items.length - 1">›</button>
    </div>
</div>
